<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Drive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }
        .card-gradient {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .card-gradient:hover {
            border-color: rgba(59, 130, 245, 0.5);
            transform: translateY(-4px);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen font-sans">

    <div class="max-w-6xl mx-auto px-4 py-12">
        <!-- Header -->
        <header class="text-center mb-16">
            <h1 class="text-5xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 mb-4">
                Project Test Drive
            </h1>
            <p class="text-slate-400 text-lg">A staging environment and directory for github experiments by rmdrake.</p>
            
            <!-- Search / Filter -->
            <div class="mt-8 max-w-md mx-auto relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i data-lucide="search" class="w-5 h-5 text-slate-500"></i>
                </div>
                <input type="text" id="search" placeholder="Search projects..." 
                    class="block w-full pl-10 pr-3 py-2 border border-slate-700 rounded-full leading-5 bg-slate-800 text-slate-200 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent sm:text-sm transition-all">
            </div>
        </header>

        <!-- Grid -->
        <div id="project-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards will be injected here by JavaScript -->
        </div>

        <!-- Footer -->
        <footer class="mt-24 text-center text-slate-500 text-sm">
            <p>&copy; <span id="year"></span> Ryan M Drake. All rights reserved.</p>
        </footer>
    </div>

    <script>
        // --- DATA CONFIGURATION ---
        const projects = [
            { title: 'Dice Roller', description: 'A sleek, modern, and responsive web application for tabletop gamers and enthusiasts to roll dice and track results effortlessly.', icon: 'dice-5', color: 'orange', link: 'dice.html', github: 'https://github.com/rmdrake/diceroller' },
            { title: 'Emo Monkey Typist', description: 'Emo Monkey Typist is a moody, themed typing test application designed for those who want to practice their typing speed and accuracy with a dark, "emo" aesthetic.', icon: 'keyboard', color: 'blue', link: 'emomonkeytypist.html', github: 'https://github.com/rmdrake/EmoMonkeyTypist' },
            { title: 'Markingdown Editor', description: 'A lightweight, single-file Markdown editor that provides a real-time preview, multiple color schemes, and a seamless writing experience directly in your web browser.', icon: 'file-text', color: 'emerald', link: 'markingdown.html', github: 'https://github.com/rmdrake/markingdown' },
            { title: 'Note Holder', description: 'A lightweight, browser-based note-taking applications designed for simplicity and efficiency.', icon: 'sticky-note', color: 'yellow', link: 'noteholder.html', github: 'https://github.com/rmdrake/noteholder' },
            { title: 'Note Holder MD', description: 'A lightweight, browser-based note-taking applications designed for simplicity and efficiency. This includes a standard note manager and a dedicated Markdown editor for structured writing.', icon: 'file-edit', color: 'purple', link: 'noteholdermd.html', github: 'https://github.com/rmdrake/noteholder' },
            { title: 'NPC Tracker', description: 'A single-file HTML application for creating and tracking Non-Player Characters (NPCs) in tabletop role-playing games.', icon: 'users', color: 'red', link: 'npctrack.html', github: 'https://github.com/rmdrake/NPCTracker' },
            { title: 'Keno', description: 'A fun, interactive, and visually engaging web-based Keno game. Experience the excitement of Keno with smooth animations, multiple themes, and real-time statistics.', icon: 'gamepad-2', color: 'orange', link: 'keno.html', github: 'https://github.com/rmdrake/keno' }
        ];

        const colorMap = {
            orange: { icon: 'text-orange-400', bg: 'bg-orange-500/10', hoverBg: 'group-hover:bg-orange-500/20', hoverText: 'group-hover:text-orange-400', githubHover: 'hover:text-orange-400' },
            blue: { icon: 'text-blue-400', bg: 'bg-blue-500/10', hoverBg: 'group-hover:bg-blue-500/20', hoverText: 'group-hover:text-blue-400', githubHover: 'hover:text-blue-400' },
            emerald: { icon: 'text-emerald-400', bg: 'bg-emerald-500/10', hoverBg: 'group-hover:bg-emerald-500/20', hoverText: 'group-hover:text-emerald-400', githubHover: 'hover:text-emerald-400' },
            yellow: { icon: 'text-yellow-400', bg: 'bg-yellow-500/10', hoverBg: 'group-hover:bg-yellow-500/20', hoverText: 'group-hover:text-yellow-400', githubHover: 'hover:text-yellow-400' },
            purple: { icon: 'text-purple-400', bg: 'bg-purple-500/10', hoverBg: 'group-hover:bg-purple-500/20', hoverText: 'group-hover:text-purple-400', githubHover: 'hover:text-purple-400' },
            red: { icon: 'text-red-400', bg: 'bg-red-500/10', hoverBg: 'group-hover:bg-red-500/20', hoverText: 'group-hover:text-red-400', githubHover: 'hover:text-red-400' }
        };

        // --- CORE LOGIC ---

        function renderProjects(filter = '') {
            const grid = document.getElementById('project-grid');
            grid.innerHTML = '';
            
            const searchTerm = filter.toLowerCase();
            
            const filteredProjects = projects
                .filter(p => 
                    p.title.toLowerCase().includes(searchTerm) || 
                    p.description.toLowerCase().includes(searchTerm)
                )
                .sort((a, b) => a.title.localeCompare(b.title));

            filteredProjects.forEach(p => {
                const colorConfig = colorMap[p.color];
                const card = document.createElement('div');
                card.className = 'card-gradient p-6 rounded-2xl group relative overflow-hidden transition-all duration-300';
                
                card.innerHTML = `
                    <div class="flex items-start justify-between mb-4">
                        <div class="p-3 ${colorConfig.bg} rounded-lg ${colorConfig.hoverBg} transition-colors">
                            <i data-lucide="${p.icon}" class="w-6 h-6 ${colorConfig.icon}"></i>
                        </div>
                        <i data-lucide="external-link" class="w-4 h-4 text-slate-600 ${colorConfig.hoverText} transition-colors"></i>
                    </div>

                    <h2 class="text-xl font-bold text-slate-100 mb-2">
                        <a href="${p.link}" class="after:absolute after:inset-0"> ${p.title} </a>
                    </h2>
                    <p class="text-slate-400 text-sm mb-4">${p.description}</p>

                    <div class="relative z-10 pt-4 border-t border-slate-700/50 flex justify-between items-center">
                        <a href="${p.github}" target="_blank" rel="noopener noreferrer" class="text-xs text-slate-500 ${colorConfig.githubHover} flex items-center gap-1 transition-colors">
                            <i data-lucide="github" class="w-3 h-3"></i> GitHub
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });

            lucide.createIcons();
        }

        // --- INITIALIZATION ---

        document.getElementById('year').textContent = new Date().getFullYear();
        renderProjects();

        document.getElementById('search').addEventListener('input', (e) => {
            renderProjects(e.target.value);
        });
    </script>
</body>
</html>
