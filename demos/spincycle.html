<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin Cycle</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --panel-bg: #ffffff;
            --text-color: #212529;
            --border-color: #dee2e6;
            --accent-color: #0d6efd;
            --accent-hover: #0b5ed4;
            --danger-color: #dc3545;
            --success-color: #198754;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333333;
            --accent-color: #378df1;
            --accent-hover: #4dabff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--panel-bg);
            box-shadow: var(--shadow);
            z-index: 10;
        }

        h1 { font-size: 1.5rem; }

        main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Layouts */
        .wheel-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }

        .spin-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            max-width: 1024px;
            max-height: 1024px;
        }

        #canvas-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 0;
        }

        #pointer-overlay {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%, -100%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid var(--accent-color);
            z-index: 10;
            pointer-events: none;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            display: block;
        }

        .controls-container {
            width: 400px;
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
            box-shadow: -2px 0 5px rgba(0,0,0,0.05);
        }

        @media (max-width: 768px) {
            main { flex-direction: column; overflow-y: auto; }
            .controls-container { width: 100%; border-left: none; border-top: 1px solid var(--border-color); }
            .wheel-container { min-height: 450px; }
            body { overflow: auto; }
        }

        /* UI Components */
        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s, opacity 0.2s;
            font-size: 0.9rem;
            text-align: center;
        }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background-color: var(--accent-color); color: white; }
        .btn-primary:hover:not(:disabled) { background-color: var(--accent-hover); }
        .btn-danger { background-color: var(--danger-color); color: white; }
        .btn-outline { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-color); }
        .btn-outline:hover:not(:disabled) { background-color: var(--border-color); }

        #spin-button {
            margin-top: 1rem;
            padding: 1rem 3rem;
            font-size: 1.5rem;
            border-radius: 50px;
            box-shadow: var(--shadow);
            flex-shrink: 0;
        }

        .input-group {
            display: flex;
            gap: 0.5rem;
        }

        input[type="text"], select {
            flex: 1;
            padding: 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--panel-bg);
            color: var(--text-color);
        }

        .option-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .option-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem;
            background-color: var(--bg-color);
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .option-item .btn-delete {
            padding: 0.2rem 0.5rem;
            font-size: 0.8rem;
        }

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .button-grid.full-width { grid-template-columns: 1fr; }

        /* Overlay */
        #winner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: white;
            text-align: center;
            padding: 2rem;
        }

        #winner-overlay h2 { font-size: 3rem; margin-bottom: 1rem; }
        #winner-overlay p { font-size: 1.2rem; opacity: 0.8; }

        /* Dialog */
        dialog {
            border: none;
            border-radius: 8px;
            padding: 2rem;
            background-color: var(--panel-bg);
            color: var(--text-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        dialog::backdrop {
            background: rgba(0,0,0,0.5);
        }

        .dialog-content {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Spin Cycle</h1>
        <button id="theme-toggle" class="btn btn-outline">🌓 Mode</button>
    </header>

    <main>
        <div class="wheel-container">
            <div class="spin-group">
                <div id="canvas-wrapper">
                    <div id="pointer-overlay"></div>
                    <canvas id="wheel-canvas"></canvas>
                </div>
                <button id="spin-button" class="btn btn-primary">SPIN!</button>
            </div>
        </div>

        <div class="controls-container">
            <section>
                <h3>Options</h3>
                <div class="input-group" style="margin-top: 0.5rem;">
                    <input type="text" id="option-input" placeholder="Enter option..." maxlength="30">
                    <button id="add-option-btn" class="btn btn-primary">Add</button>
                </div>
                <ul id="option-list" class="option-list" style="margin-top: 1rem; max-height: 250px; overflow-y: auto;">
                </ul>
                <button id="clear-all-btn" class="btn btn-outline btn-danger full-width" style="width:100%; margin-top: 0.5rem;">Clear All</button>
            </section>

            <section>
                <h3>Presets</h3>
                <select id="preset-select" style="margin-top: 0.5rem; width: 100%; margin-bottom: 1rem;">
                </select>
                <div class="button-grid">
                    <button id="save-preset-btn" class="btn btn-outline">Save Preset</button>
                    <button id="delete-preset-btn" class="btn btn-outline">Delete Preset</button>
                </div>
                <div class="button-grid" style="margin-top: 0.5rem;">
                    <button id="import-btn" class="btn btn-outline">Import</button>
                    <button id="export-btn" class="btn btn-outline">Export</button>
                </div>
                <input type="file" id="file-input" style="display: none;" accept=".json">
            </section>
        </div>
    </main>

    <div id="winner-overlay">
        <h2 id="winner-text">Option</h2>
    </div>

    <dialog id="preset-dialog">
        <div class="dialog-content">
            <h3>Save Preset</h3>
            <input type="text" id="preset-name-input" placeholder="Preset Name">
            <div class="button-grid">
                <button id="cancel-preset-btn" class="btn btn-outline">Cancel</button>
                <button id="confirm-preset-btn" class="btn btn-primary">Save</button>
            </div>
        </div>
    </dialog>

    <script>
        const DEFAULT_PRESETS = [
            { id: 'default-magic8', name: 'Magic 8-Ball', options: ["It is Certain", "It is Decidedly so", "Reply hazy, try again", "Don't count on it", "Without a doubt", "Yes, definitely", "Ask again later", "My reply is no", "You may rely on it", "As I see it, yes", "Better not tell you now", "My sources say no ","Most likely", "Outlook good", "Cannot predict now", "Outlook not so good", "Yes", "Signs point to yes", "Concentrate and ask again", "Very doubtful"] },
            { id: 'default-yesno', name: 'Yes/No', options: ["Yes", "No"] }
        ];

        let state = {
            options: ["Option 1", "Option 2", "Option 3", "Option 4"],
            presets: [],
            isSpinning: false,
            theme: 'light'
        };

        const storageManager = {
            load() {
                const savedOptions = localStorage.getItem('sc_options');
                const savedPresets = localStorage.getItem('sc_presets');
                const savedTheme = localStorage.getItem('sc_theme');
                if (savedOptions) state.options = JSON.parse(savedOptions);
                if (savedPresets) state.presets = JSON.parse(savedPresets);
                if (savedTheme) state.theme = savedTheme;
                document.documentElement.setAttribute('data-theme', state.theme);
            },
            save(reRenderPresets = true) {
                localStorage.setItem('sc_options', JSON.stringify(state.options));
                localStorage.setItem('sc_presets', JSON.stringify(state.presets));
                localStorage.setItem('sc_theme', state.theme);
                renderOptionsList();
                if (reRenderPresets) renderPresetDropdown();
                drawWheel();
            },
            getMergedPresets() {
                const userPresets = [...state.presets];
                const defaults = [...DEFAULT_PRESETS].sort((a, b) => a.name.localeCompare(b.name));
                const users = [...userPresets].sort((a, b) => a.name.localeCompare(b.name));
                return [...defaults, ...users];
            },
            mergeImported(json) {
                let newCount = 0;
                json.forEach(p => {
                    if (!state.presets.find(existing => existing.id === p.id)) {
                        state.presets.push(p);
                        newCount++;
                    }
                });
                alert(`Imported ${newCount} new presets.`);
                this.save();
            }
        };

        const canvas = document.getElementById('wheel-canvas');
        const ctx = canvas.getContext('2d');
        let rotation = 0;
        let spinVelocity = 0;
        const friction = 0.985;
        const minVelocity = 0.001;

        const COLORS = ['#FF6B6B', '#FFD93D', '#6BCB77', '#4D96FF', '#9B59B6', '#F39C12', '#E74C3C', '#2ECC71', '#3498DB', '#9B59B6', '#1ABC9C', '#F1C40F', '#E67E22', '#E74C3C', '#95A5A6'];

        function resizeCanvas() {
            const wrapper = document.getElementById('canvas-wrapper');
            const size = Math.min(wrapper.clientWidth, wrapper.clientHeight);
            canvas.width = size;
            canvas.height = size;
            drawWheel();
        }

        function drawWheel() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const radius = canvas.width / 2;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (state.options.length === 0) {
                ctx.fillStyle = state.theme === 'dark' ? '#eee' : '#333';
                ctx.textAlign = 'center';
                ctx.fillText("Add options to spin!", cx, cy);
                return;
            }
            const sliceAngle = (Math.PI * 2) / state.options.length;
            state.options.forEach((opt, i) => {
                const startAngle = i * sliceAngle + rotation;
                const endAngle = startAngle + sliceAngle;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, startAngle, endAngle);
                ctx.fillStyle = COLORS[i % COLORS.length];
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "white";
                ctx.shadowColor = "rgba(0,0,0,0.5)";
                ctx.shadowBlur = 4;
                
                // Dynamic Font Sizing
                let fontSize = Math.max(10, radius / 8);
                ctx.font = `bold ${fontSize}px sans-serif`;
                
                const textDist = radius - 30;
                const textWidth = ctx.measureText(opt).width;
                const maxTextWidth = (textDist * sliceAngle) * 0.8;

                if (textWidth > maxTextWidth && maxTextWidth > 10) {
                    fontSize = fontSize * (maxTextWidth / textWidth);
                    ctx.font = `bold ${fontSize}px sans-serif`;
                }

                ctx.fillText(opt, textDist, 5);
                ctx.restore();
            });
            ctx.beginPath();
            ctx.arc(cx, cy, 15, 0, Math.PI * 2);
            ctx.fillStyle = state.theme === 'dark' ? '#333' : '#fff';
            ctx.fill();
            ctx.strokeStyle = varColor('--accent-color');
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function varColor(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        function spin() {
            if (state.isSpinning || state.options.length < 2) return;
            state.isSpinning = true;
            spinVelocity = Math.random() * 2.0 + 1.0;
            animate();
        }

        function animate() {
            if (spinVelocity < minVelocity) {
                spinVelocity = 0;
                state.isSpinning = false;
                announceWinner();
                return;
            }
            spinVelocity *= friction;
            rotation += spinVelocity;
            drawWheel();
            requestAnimationFrame(animate);
        }

        function announceWinner() {
            const sliceAngle = (Math.PI * 2) / state.options.length;
            const targetAngle = -Math.PI / 2;
            let winningIndex = Math.floor((targetAngle - rotation) / sliceAngle);
            winningIndex = ((winningIndex % state.options.length) + state.options.length) % state.options.length;
            document.getElementById('winner-text').innerText = state.options[winningIndex];
            document.getElementById('winner-overlay').style.display = 'flex';
        }

        function renderOptionsList() {
            const list = document.getElementById('option-list');
            list.innerHTML = '';
            state.options.forEach((opt, index) => {
                const li = document.createElement('li');
                li.className = 'option-item';
                li.innerHTML = `<span>${opt}</span><button class="btn btn-danger btn-delete" data-index="${index}">X</button>`;
                list.appendChild(li);
            });
        }

        function renderPresetDropdown() {
            const select = document.getElementById('preset-select');
            const currentValue = select.value;
            select.innerHTML = '<option value="" disabled selected>Select a preset...</option>';
            storageManager.getMergedPresets().forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = p.name;
                select.appendChild(opt);
            });
            select.value = currentValue;
        }

        document.getElementById('theme-toggle').addEventListener('click', () => {
            state.theme = state.theme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', state.theme);
            storageManager.save();
        });

        document.getElementById('spin-button').addEventListener('click', spin);
        document.getElementById('winner-overlay').addEventListener('click', () => {
            document.getElementById('winner-overlay').style.display = 'none';
        });

        const optInput = document.getElementById('option-input');
        const addOptBtn = document.getElementById('add-option-btn');
        function addOption() {
            const val = optInput.value.trim();
            if (val) { state.options.push(val); optInput.value = ''; storageManager.save(); }
        }
        addOptBtn.addEventListener('click', addOption);
        optInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addOption(); });

        document.getElementById('option-list').addEventListener('click', (e) => {
            if (e.target.classList.contains('btn-delete')) {
                const idx = parseInt(e.target.dataset.index);
                state.options.splice(idx, 1);
                storageManager.save();
            }
        });

        document.getElementById('clear-all-btn').addEventListener('click', () => {
            if (confirm('Clear all options?')) { state.options = []; storageManager.save(); }
        });

        document.getElementById('preset-select').addEventListener('change', (e) => {
            const presetId = e.target.value;
            if (!presetId) return;
            const preset = storageManager.getMergedPresets().find(p => p.id === presetId);
            if (preset) { 
                state.options = [...preset.options]; 
                localStorage.setItem('sc_options', JSON.stringify(state.options));
                renderOptionsList();
                drawWheel();
            }
        });

        const presetDialog = document.getElementById('preset-dialog');
        document.getElementById('save-preset-btn').addEventListener('click', () => {
            if (state.options.length === 0) return alert('Add some options first!');
            presetDialog.showModal();
        });
        document.getElementById('cancel-preset-btn').addEventListener('click', () => presetDialog.close());
        document.getElementById('confirm-preset-btn').addEventListener('click', () => {
            const name = document.getElementById('preset-name-input').value.trim();
            if (name) {
                state.presets.push({ id: Date.now().toString(), name: name, options: [...state.options] });
                storageManager.save();
                presetDialog.close();
                document.getElementById('preset-name-input').value = '';
            }
        });

        document.getElementById('delete-preset-btn').addEventListener('click', () => {
            const id = document.getElementById('preset-select').value;
            if (!id) {
                alert('Please select a preset from the dropdown first.');
                return;
            }
            if (confirm('Delete this preset?')) {
                const isDefault = DEFAULT_PRESETS.some(p => p.id === id);
                if (isDefault) {
                    alert('You cannot delete default presets.');
                } else {
                    state.presets = state.presets.filter(p => p.id !== id);
                    storageManager.save();
                }
            }
        });

        document.getElementById('export-btn').addEventListener('click', () => {
            const blob = new Blob([JSON.stringify(state.presets, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'spincycle_presets.json'; a.click();
            URL.revokeObjectURL(url);
        });

        document.getElementById('import-btn').addEventListener('click', () => document.getElementById('file-input').click());
        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    try { storageManager.mergeImported(JSON.parse(event.target.result)); } catch (err) { alert('Invalid JSON file'); }
                };
                reader.readAsText(file);
            }
        });

        window.addEventListener('resize', resizeCanvas);
        (function init() {
            storageManager.load();
            renderOptionsList();
            renderPresetDropdown();
            resizeCanvas();
            drawWheel();
        })();
    </script>
</body>
</html>
