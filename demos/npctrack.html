<!DOCTYPE html>
<html lang="en" data-theme="space" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>NPC Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='8' width='48' height='48' rx='10' fill='%234a628c'/%3E%3Ccircle cx='24' cy='24' r='5' fill='white'/%3E%3Ccircle cx='40' cy='40' r='5' fill='white'/%3E%3Ccircle cx='40' cy='24' r='4' fill='white'/%3E%3Ccircle cx='24' cy='40' r='4' fill='white'/%3E%3C/svg%3E">
<script>(function () { try { var s = JSON.parse(localStorage.getItem('npc8.settings') || '{}'); document.documentElement.dataset.mode = (s.mode === 'dark') ? 'dark' : 'light'; if (['space', 'ocean', 'desert', 'forest'].indexOf(s.theme) >= 0) document.documentElement.dataset.theme = s.theme; } catch (e) {} })();</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root { color-scheme: light; }
html[data-mode="dark"] { color-scheme: dark; }

/* ---------- Color themes (light + dark) ---------- */
html[data-theme="space"][data-mode="light"]  { --bg:#e9ebef; --surface:#ffffff; --surface-2:#f1f4f8; --text:#1b2027; --muted:#5c6673; --border:#d2d9e2; --accent:#4a628c; --on-accent:#ffffff; --focus:rgba(74,98,140,.35); }
html[data-theme="space"][data-mode="dark"]   { --bg:#14171c; --surface:#1d222b; --surface-2:#242c38; --text:#e7ebf1; --muted:#9aa6b5; --border:#333d4c; --accent:#7fa0cf; --on-accent:#10151d; --focus:rgba(127,160,207,.4); }
html[data-theme="ocean"][data-mode="light"]  { --bg:#e8f1f7; --surface:#ffffff; --surface-2:#eff6fb; --text:#13303f; --muted:#4c6a80; --border:#bfd6e5; --accent:#106ea5; --on-accent:#ffffff; --focus:rgba(16,110,165,.3); }
html[data-theme="ocean"][data-mode="dark"]   { --bg:#0b141d; --surface:#13202c; --surface-2:#1a2938; --text:#daeaf5; --muted:#7fa3bd; --border:#2c455c; --accent:#57a9dc; --on-accent:#0b141d; --focus:rgba(87,169,220,.4); }
html[data-theme="desert"][data-mode="light"] { --bg:#f5eddd; --surface:#fffbf3; --surface-2:#f7efe0; --text:#3b2b17; --muted:#7c6a4f; --border:#d9c49c; --accent:#ad5c1c; --on-accent:#ffffff; --focus:rgba(173,92,28,.3); }
html[data-theme="desert"][data-mode="dark"]  { --bg:#191208; --surface:#241a0e; --surface-2:#2d2213; --text:#f1e3cb; --muted:#bd9f78; --border:#4b3822; --accent:#de9a55; --on-accent:#221204; --focus:rgba(222,154,85,.4); }
html[data-theme="forest"][data-mode="light"] { --bg:#ecf1e3; --surface:#fdfefb; --surface-2:#f0f5e6; --text:#1d2c1e; --muted:#5a7859; --border:#c1d1b4; --accent:#2f7d4e; --on-accent:#ffffff; --focus:rgba(47,125,78,.3); }
html[data-theme="forest"][data-mode="dark"]  { --bg:#121b13; --surface:#1a271e; --surface-2:#223126; --text:#dcebda; --muted:#87a489; --border:#30503a; --accent:#5fbe79; --on-accent:#0c1a10; --focus:rgba(95,190,121,.4); }

html[data-mode="light"] { --hp-ok:#2f9e4f; --hp-half:#d3801a; --hp-crit:#cd3b3b; }
html[data-mode="dark"]  { --hp-ok:#55c07b; --hp-half:#e6982f; --hp-crit:#dd5454; }

/* ---------- Base ---------- */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); transition: background-color .25s ease, color .25s ease; }

/* ---------- Scrollbars ---------- */
::-webkit-scrollbar {
  width: 12px;
  height: 12px;
}

::-webkit-scrollbar-track {
  background: var(--bg);
}

::-webkit-scrollbar-thumb {
  background: var(--muted);
  border: 3px solid var(--bg);
  border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--accent);
}

/* Firefox */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--muted) var(--bg);
}

.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
button, select, input, textarea { font: inherit; color: inherit; }

/* ---------- Sticky header ---------- */
.topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 18px; background: var(--surface); border-bottom: 1px solid var(--border); box-shadow: 0 2px 10px rgba(0,0,0,.08); transition: background-color .25s ease, border-color .25s ease; }
.topbar__left, .topbar__right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.title { margin: 0 4px 0 0; font-size: 1.2rem; letter-spacing: .5px; white-space: nowrap; text-transform: uppercase; font-weight: 800; color: var(--accent); }

.btn, .select { appearance: none; cursor: pointer; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 13px; line-height: 1.1; font-size: .92rem; transition: filter .15s ease, transform .05s ease, background-color .2s ease, color .2s ease; }
.btn:hover, .select:hover { filter: brightness(1.07); }
html[data-mode="dark"] .btn:hover, html[data-mode="dark"] .select:hover { filter: brightness(1.18); }
.btn:active, .select:active { transform: translateY(1px); }
.btn[disabled], .select[disabled] { opacity: .45; cursor: not-allowed; pointer-events: none; }
.btn:focus-visible, .select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.btn--accent { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.btn--danger:hover { border-color: var(--hp-crit); color: var(--hp-crit); filter: brightness(1.04); }
.select { padding-right: 28px; min-width: 170px; max-width: 34vw; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }

/* ---------- Page layout (fluid, full width) ---------- */
.page { width: 100%; padding: 22px clamp(14px, 3vw, 42px) 64px; display: flex; flex-direction: column; gap: 28px; }
.section-title { margin: 0 0 14px; font-size: .95rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 700; }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; box-shadow: 0 2px 8px rgba(0,0,0,.05); transition: background-color .25s ease, border-color .25s ease; }

/* ---------- Creator form ---------- */
.fields { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); align-items: start; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: .74rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
.field input, .field textarea { width: 100%; resize: vertical; min-height: 34px; padding: 8px 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; transition: background-color .2s ease, border-color .2s ease; }
.field textarea { min-height: 96px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9rem; line-height: 1.45; }
.creator__btns { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

/* ---------- Card grid ---------- */
.grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 550px), 640px)); justify-content: center; }
.empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 38px 20px; border: 2px dashed var(--border); border-radius: 14px; background: transparent; font-size: .95rem; line-height: 1.6; }

.card { position: relative; display: flex; flex-direction: column; gap: 11px; overflow: hidden; min-height: 250px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--border); border-top: 4px solid var(--accent); border-radius: 14px; box-shadow: 0 3px 12px rgba(0,0,0,.07); transition: transform .15s ease, background-color .25s ease, border-color .25s ease, filter .25s ease, opacity .25s ease; scroll-margin-top: 96px; }
.card:hover { transform: translateY(-2px); }
.card[data-status="half"]     { border-top-color: var(--hp-half); }
.card[data-status="critical"] { border-top-color: var(--hp-crit); }
.card[data-status="down"]     { border-top-color: var(--muted); background: #7a8089; background: color-mix(in srgb, var(--surface) 52%, var(--bg)); filter: saturate(.45) brightness(.97); opacity: .93; }
.card.flash { animation: flash .9s ease-in-out 4; }
@keyframes flash {
  0%, 100% { box-shadow: 0 3px 12px rgba(0,0,0,.07); }
  50% { box-shadow: 0 0 0 3px var(--accent), 0 3px 22px var(--focus); }
}

.card__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; min-width: 0; }
.card__name { margin: 0; font-size: 1.4rem; line-height: 1.25; overflow-wrap: anywhere; font-weight: 700; }
.card[data-status="down"] .card__name { text-decoration: line-through; color: var(--muted); }
.card__level { flex-shrink: 0; font-weight: 700; font-size: .8rem; letter-spacing: .6px; padding: 4px 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); white-space: nowrap; text-transform: uppercase; }
.card__class { margin: -3px 0 0; font-size: .85rem; color: var(--muted); text-transform: capitalize; letter-spacing: .4px; overflow-wrap: anywhere; }

.hp-area { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; min-width: 0; }
.hp-left { font-size: .95rem; white-space: nowrap; }
.hp-val, .max-val { font-weight: 700; font-size: 1.02rem; }
.card[data-status="half"] .hp-val     { color: var(--hp-half); }
.card[data-status="critical"] .hp-val,
.card[data-status="down"] .hp-val     { color: var(--hp-crit); }
.hp-right { display: flex; align-items: center; gap: 8px; min-width: 0; }

.status-chip { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
.status-chip:empty { display: none; }
.card[data-status="half"] .status-chip     { color: var(--hp-half); border-color: var(--hp-half); }
.card[data-status="critical"] .status-chip,
.card[data-status="down"] .status-chip     { color: var(--hp-crit); border-color: var(--hp-crit); }

.hp-pct { font-size: .82rem; font-weight: 700; min-width: 52px; text-align: right; color: var(--muted); white-space: nowrap; }

.hp-track { height: 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; }
.hp-fill { height: 100%; width: 0%; border-radius: 999px; background: var(--hp-ok); transition: width .35s ease, background-color .25s ease; }
.card[data-status="half"] .hp-fill     { background: var(--hp-half); }
.card[data-status="critical"] .hp-fill { background: var(--hp-crit); }
.card[data-status="down"] .hp-fill     { background: var(--muted); }

.hp-btns { display: grid; gap: 8px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.btn--hp { text-align: center; font-weight: 700; padding: 8px 0; letter-spacing: .3px; user-select: none; }

.card__notes { overflow-wrap: anywhere; word-break: break-word; }
.card__notes.is-empty { color: var(--muted); font-style: italic; font-size: .9rem; }
.card__notes :is(p, ul, ol) { margin: .45rem 0; line-height: 1.55; font-size: .95rem; }
.card__notes h1, .card__notes h2, .card__notes h3, .card__notes h4 { line-height: 1.3; margin: .75rem 0 .3rem; }
.card__notes code { background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; font-size: .85em; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.card__notes pre { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; overflow-x: auto; }
.card__notes blockquote { margin: .5rem 0; padding-left: 12px; border-left: 3px solid var(--accent); color: var(--muted); }
.card__notes a { color: var(--accent); word-break: break-all; }

.card__foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 6px; border-top: 1px solid var(--border); }

/* ---------- Toast ---------- */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); max-width: min(92vw, 520px); padding: 10px 18px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; z-index: 30; font-size: .9rem; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Small screens ---------- */
@media (max-width: 760px) {
  .topbar { align-items: flex-start; }
  .title { font-size: 1.02rem; }
  .select { min-width: 130px; max-width: none; flex: 1 1 auto; }
  .grid { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .card { min-height: 0; padding: 14px 15px; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar__left">
    <h1 class="title">NPC Tracker</h1>
    <select id="tocSelect" class="select" aria-label="Jump to character"></select>
    <button id="toTopBtn" class="btn" type="button">↑ Top</button>
  </div>
  <div class="topbar__right">
    <button id="importBtn" class="btn" type="button">Import</button>
    <input id="importFile" type="file" accept=".json,application/json" hidden>
    <button id="exportBtn" class="btn" type="button">Export</button>
    <button id="deleteAllBtn" class="btn btn--danger" type="button">Delete All</button>
    <select id="themeSelect" class="select" aria-label="Color theme">
      <option value="space">Space</option>
      <option value="ocean">Ocean</option>
      <option value="desert">Desert</option>
      <option value="forest">Forest</option>
    </select>
    <button id="darkModeBtn" class="btn" type="button" aria-pressed="false">Dark Mode</button>
  </div>
</header>

<main class="page">
  <section class="panel" aria-labelledby="creatorTitle">
    <h2 class="section-title" id="creatorTitle">Character Creator</h2>
    <form id="charForm" novalidate>
      <div class="fields">
        <label class="field"><span>Name *</span><input type="text" name="name" autocomplete="off" required placeholder="e.g. Sir Reginald"></label>
        <label class="field"><span>Class</span><input type="text" name="class" autocomplete="off" placeholder="e.g. Fighter, Wizard…"></label>
        <label class="field"><span>Level</span><input type="number" name="level" step="1" value="1"></label>
        <label class="field"><span>Current HP</span><input type="number" name="HP" step="1" value="0"></label>
        <label class="field"><span>Max HP</span><input type="number" name="maxHP" step="1" min="0" value="20"></label>
      </div>
      <div class="fields" style="margin-top: 12px;">
        <label class="field" style="grid-column: 1 / -1;"><span>Notes (Markdown supported)</span><textarea name="notes" rows="10" placeholder="# Notes&#10;- Supports **bold**, *italic*, `code`, lists…"></textarea></label>
      </div>
      <div class="creator__btns">
        <button type="submit" id="saveBtn" class="btn btn--accent">Save Character</button>
        <button type="button" id="cancelBtn" class="btn">Cancel</button>
      </div>
    </form>
  </section>

  <section aria-label="Characters">
    <p id="hpAnnounce" class="sr-only" aria-live="polite"></p>
    <div id="charGrid" class="grid"></div>
  </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'npc8.characters';
  var SETTINGS_KEY = 'npc8.settings';
  var THEMES = ['space', 'ocean', 'desert', 'forest'];

  // ---------- State ----------
  var characters = [];
  var editingId = null;
  var toastTimer = null;

  // ---------- DOM refs ----------
  var rootEl = document.documentElement;
  var grid = document.getElementById('charGrid');
  var tocSelect = document.getElementById('tocSelect');
  var toTopBtn = document.getElementById('toTopBtn');
  var importBtn = document.getElementById('importBtn');
  var importFile = document.getElementById('importFile');
  var exportBtn = document.getElementById('exportBtn');
  var deleteAllBtn = document.getElementById('deleteAllBtn');
  var themeSelect = document.getElementById('themeSelect');
  var darkModeBtn = document.getElementById('darkModeBtn');
  var form = document.getElementById('charForm');
  var saveBtn = document.getElementById('saveBtn');
  var cancelBtn = document.getElementById('cancelBtn');
  var creatorTitle = document.getElementById('creatorTitle');
  var toastEl = document.getElementById('toast');
  var hpAnnounce = document.getElementById('hpAnnounce');

  // ---------- Storage (failure-tolerant) ----------
  function safeGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function safeSet(key, val) { try { localStorage.setItem(key, val); return true; } catch (e) { return false; } }

  // ---------- Small utilities ----------
  function uid() {
    var n = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
    return 'npc-' + n;
  }
  function toInt(v, fallback) {
    if (typeof v === 'number') return isFinite(v) ? Math.round(v) : fallback;
    var s = String(v == null ? '' : v).trim();
    var n = parseInt(s, 10);
    return isNaN(n) ? fallback : n;
  }
  function clampPct(fraction, lo, hi) {
    var f = fraction < lo ? lo : (fraction > hi ? hi : fraction);
    return Math.round(f * 100);
  }
  function escHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ---------- Data model (accepts the documented JSON shape, tolerates minor deviations) ----------
  function normalizeChar(raw) {
    raw = typeof raw === 'object' && raw !== null ? raw : {};
    return {
      id: (typeof raw.id === 'string' && raw.id.trim() !== '') || typeof raw.id === 'number' ? String(raw.id) : uid(),
      name: String(raw.name == null ? '' : raw.name).trim(),
      'class': String(raw['class'] == null ? '' : raw['class']).trim(),
      level: Math.max(0, toInt(raw.level != null ? raw.level : raw.lvl, 1)),
      maxHP: Math.max(0, toInt(raw.maxHP, 20)),
      HP: toInt(raw.HP, 0), // intentionally allows < 1 and > maxHP (plan requirement)
      notes: String(raw.notes == null ? '' : raw.notes)
    };
  }

  function makePlain(c) {
    return { id: c.id, name: c.name, 'class': c['class'], level: c.level, maxHP: c.maxHP, HP: c.HP, notes: c.notes };
  }

  function loadCharacters() {
    try {
      var raw = JSON.parse(safeGet(STORAGE_KEY) || '[]');
      if (!Array.isArray(raw)) return [];
      characters = raw.map(normalizeChar);
      saveCharacters(); // persist canonicalized copy (repairs legacy/odd data once)
    } catch (e) {
      characters = [];
    }
  }

  function saveCharacters() { safeSet(STORAGE_KEY, JSON.stringify(characters)); }

  function sortedChars() {
    return characters.slice().sort(function (a, b) {
      return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }) || String(a.id).localeCompare(String(b.id));
    });
  }

  function charById(id) {
    for (var i = 0; i < characters.length; i++) if (characters[i].id === id) return characters[i];
    return null;
  }

  // ---------- Status / HP math ----------
  function statusOf(c) {
    if (c.HP <= 0) return 'down';
    if (c.maxHP > 0) {
      var r = c.HP / c.maxHP;
      if (r <= 1 / 4) return 'critical';
      if (r <= 1 / 2) return 'half';
    }
    return 'healthy';
  }
  function pctText(c) {
    if (c.maxHP > 0) return Math.round((c.HP / c.maxHP) * 100) + '%';
    return c.HP > 0 ? '\u221E' : '0%'; // \u221E = infinity sign
  }
  function barFraction(c) {
    if (c.maxHP > 0) return clampPct(c.HP / c.maxHP, 0, 1) / 100;
    return c.HP > 0 ? 1 : 0;
  }
  function statusChipText(s) {
    if (s === 'half') return 'Half HP';
    if (s === 'critical') return 'Critical';
    if (s === 'down') return 'Down';
    return '';
  }

  // ---------- Toast / announcements ----------
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2800);
  }
  function announceHp(c) {
    var msg = c.name + ": " + c.HP + " of " + c.maxHP + " HP (" + statusOf(c) + ")";
    hpAnnounce.textContent = msg; // visually hidden but announced by screen readers
    clearTimeout(announceHp._t);
    announceHp._t = setTimeout(function () { if (hpAnnounce.textContent === msg) hpAnnounce.textContent = ''; }, 4500);
  }

  // ---------- Markdown rendering ----------
  function fallbackMd(src) {
    var esc = src.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return '<p>' + String(esc).split(/\n\s*\n+/).map(function (b) {
      b = b.trim(); if (!b) return '';
      return b.replace(/\n/g, '<br>');
    }).filter(Boolean).join('</p><p>') + '</p>';
  }

  function sanitizeHtml(html) {
    return String(html)
      .replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script\s*>/gi, '')
      .replace(/\son[a-z]+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '');
  }

  function renderMarkdown(src) {
    var raw = String(src || '').trim();
    if (!raw) return '';
    var html;
    try {
      if (typeof window.marked !== 'undefined') html = sanitizeHtml(window.marked.parse(raw, { breaks: true }));
      else html = fallbackMd(raw);
    } catch (e) {
      html = '<p>' + escHtml(raw).replace(/\n/g, '<br>') + '</p>';
    }
    return html;
  }

  // ---------- Card construction & refresh ----------
  function buildCard(c) {
    var card = document.createElement('article');
    card.className = 'card';
    card.dataset.id = c.id;
    card.dataset.status = statusOf(c);

    // --- Head: name + level
    var head = document.createElement('div');
    head.className = 'card__head';
    var nameEl = document.createElement('h3');
    nameEl.className = 'card__name';
    nameEl.textContent = c.name;
    var lvlEl = document.createElement('span');
    lvlEl.className = 'card__level';
    lvlEl.textContent = 'LVL ' + c.level;
    head.appendChild(nameEl);
    head.appendChild(lvlEl);
    card.appendChild(head);

    // --- Class (optional)
    if (c['class'] !== '') {
      var cls = document.createElement('p');
      cls.className = 'card__class';
      cls.textContent = c['class'];
      card.appendChild(cls);
    }

    // --- HP area: number + status chip + percent
    var hpArea = document.createElement('div');
    hpArea.className = 'hp-area';

    var hpLeft = document.createElement('span');
    hpLeft.className = 'hp-left';
    var vEl = document.createElement('b');
    vEl.className = 'hp-val';
    vEl.textContent = c.HP;
    hpLeft.appendChild(vEl);
    hpLeft.appendChild(document.createTextNode(' / '));
    var maxEl = document.createElement('span');
    maxEl.className = 'max-val';
    maxEl.textContent = c.maxHP;
    hpLeft.appendChild(maxEl);

    var hpRight = document.createElement('div');
    hpRight.className = 'hp-right';
    var chipEl = document.createElement('span');
    chipEl.className = 'status-chip';
    chipEl.textContent = statusChipText(statusOf(c));
    var pctEl = document.createElement('span');
    pctEl.className = 'hp-pct';
    pctEl.textContent = pctText(c);
    hpRight.appendChild(chipEl);
    hpRight.appendChild(pctEl);

    hpArea.appendChild(hpLeft);
    hpArea.appendChild(hpRight);
    card.appendChild(hpArea);

    // --- HP bar (integer percent width, clamped to 0-100%)
    var track = document.createElement('div');
    track.className = 'hp-track';
    var fill = document.createElement('div');
    fill.className = 'hp-fill';
    fill.style.width = Math.round(barFraction(c) * 100) + '%';
    track.appendChild(fill);
    card.appendChild(track);

    // --- HP adjustment buttons: -10, -1, +1, +10
    var btns = document.createElement('div');
    btns.className = 'hp-btns';
    [-10, -1, 1, 10].forEach(function (delta) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn btn--hp';
      b.dataset.delta = String(delta);
      b.textContent = delta > 0 ? '+' + delta : String(delta);
      b.title = (delta > 0 ? 'Increase' : 'Decrease') + ' HP by ' + Math.abs(delta);
      btns.appendChild(b);
    });
    card.appendChild(btns);

    // --- Rendered markdown notes
    var notesEl = document.createElement('div');
    notesEl.className = 'card__notes';
    if (c.notes && c.notes.trim() !== '') {
      notesEl.innerHTML = renderMarkdown(c.notes);
    } else {
      notesEl.classList.add('is-empty');
      notesEl.textContent = '\u2014 no notes \u2014'; // em dashes
    }
    card.appendChild(notesEl);

    // --- Footer: Edit (left) / Delete (right)
    var foot = document.createElement('div');
    foot.className = 'card__foot';
    var editBtn = document.createElement('button');
    editBtn.type = 'button';
    editBtn.className = 'btn';
    editBtn.dataset.act = 'edit';
    editBtn.textContent = 'Edit';
    editBtn.title = "Edit '" + c.name + "'";
    foot.appendChild(editBtn);

    var delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'btn btn--danger';
    delBtn.dataset.act = 'delete';
    delBtn.textContent = 'Delete';
    delBtn.title = "Delete '" + c.name + "'";
    foot.appendChild(delBtn);

    card.appendChild(foot);
    return card;
  }

  function findCard(id) {
    var cards = grid.querySelectorAll('.card');
    for (var i = 0; i < cards.length; i++) if (cards[i].dataset.id === id) return cards[i];
    return null;
  }

  // In-place refresh after an HP adjustment (no full re-render, preserves hover/focus/scroll).
  function refreshHpCard(cardEl, c) {
    cardEl.dataset.status = statusOf(c);
    cardEl.querySelector('.hp-val').textContent = c.HP;
    cardEl.querySelector('.max-val').textContent = c.maxHP;
    cardEl.querySelector('.status-chip').textContent = statusChipText(statusOf(c));
    cardEl.querySelector('.hp-pct').textContent = pctText(c);
    var fill = cardEl.querySelector('.hp-fill');
    if (fill) fill.style.width = Math.round(clampPct(barFraction(c), 0, 1) * 100) + '%';
  }

  // ---------- Rendering ----------
  function renderToc() {
    tocSelect.length = 0; // clears options
    var holder = document.createElement('option');
    holder.value = '';
    holder.textContent = 'Jump to character\u2026';
    holder.disabled = true;
    holder.selected = true;
    tocSelect.appendChild(holder);

    sortedChars().forEach(function (c) {
      var opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = c.name === '' ? '\u2014 (unnamed) \u2014' : c.name; // em dashes
      tocSelect.appendChild(opt);
    });
    tocSelect.disabled = characters.length === 0;
  }

  function renderGrid() {
    grid.innerHTML = '';
    if (characters.length === 0) {
      var emptyEl = document.createElement('div');
      emptyEl.className = 'empty';
      emptyEl.textContent = "No characters yet. Use the Creator above to add one, or Import a .json file to bring them in.";
      grid.appendChild(emptyEl);
    } else {
      sortedChars().forEach(function (c) { grid.appendChild(buildCard(c)); });
    }
    deleteAllBtn.disabled = characters.length === 0;
    renderToc();
  }

  function flashCard(id) {
    var cardEl = findCard(id);
    if (!cardEl) return null;
    cardEl.classList.remove('flash');
    // force reflow so the animation can be re-triggered on repeat jumps
    void cardEl.offsetWidth;
    cardEl.classList.add('flash');
    clearTimeout(flashCard._t);
    flashCard._t = setTimeout(function () { cardEl.classList.remove('flash'); }, 3700);
    return cardEl;
  }

  // ---------- Creator form ----------
  function readForm() {
    var data = form.elements;
    return {
      name: String(data.name.value).trim(),
      'class': String(data['class'].value).trim(),
      level: Math.max(0, toInt(data.level.value, 1)),
      HP: toInt(data.HP.value, 0),
      maxHP: Math.max(0, toInt(data.maxHP.value, 20)),
      notes: String(data.notes.value)
    };
  }

  function resetForm(msg) {
    editingId = null;
    form.reset(); // restores markup defaults (level=1, HP=0, maxHP=20, empty name/class/notes)
    saveBtn.textContent = 'Save Character';
    creatorTitle.textContent = 'Character Creator';
    if (msg) toast(msg);
  }

  function startEdit(id) {
    var c = charById(id);
    if (!c) return;
    editingId = id;
    form.elements.name.value = c.name;
    form.elements['class'].value = c['class'];
    form.elements.level.value = String(c.level);
    form.elements.HP.value = String(c.HP);
    form.elements.maxHP.value = String(c.maxHP);
    form.elements.notes.value = c.notes;
    saveBtn.textContent = 'Update Character';
    creatorTitle.textContent = "Edit: " + (c.name === '' ? '(unnamed)' : c.name);
    // scroll the creator into view, clearing the sticky header height so it is not hidden under it
    var formTop = form.getBoundingClientRect().top + window.pageYOffset;
    var headerH = document.querySelector('.topbar').getBoundingClientRect().height;
    window.scrollTo({ top: Math.max(0, formTop - headerH - 12), behavior: 'smooth' });
    setTimeout(function () { form.elements.name.focus({ preventScroll: true }); }, 350);
  }

  function handleSave(e) {
    e.preventDefault();
    var data = readForm();
    if (data.name === '') {
      toast('Name is required.');
      form.elements.name.focus();
      return;
    }
    var targetId = null;
    if (editingId !== null && charById(editingId)) {
      var c = charById(editingId);
      c.name = data.name;
      c['class'] = data['class'];
      c.level = data.level;
      c.HP = data.HP;
      c.maxHP = data.maxHP;
      c.notes = data.notes;
      targetId = c.id;
      saveCharacters();
      renderGrid();
      resetForm('Updated "' + data.name + '".');
    } else {
      var newChar = { id: uid(), name: data.name, 'class': data['class'], level: data.level, HP: data.HP, maxHP: data.maxHP, notes: data.notes };
      characters.push(newChar);
      targetId = newChar.id;
      saveCharacters();
      renderGrid();
      resetForm('Added "' + data.name + '".');
    }
    if (targetId) {
      var cardEl = flashCard(targetId);
      if (cardEl) {
        cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }
  }

  // ---------- Grid events (delegated) ----------
  grid.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || typeof t.closest !== 'function') return;
    var btnEl = t.closest('button');
    if (!btnEl || !grid.contains(btnEl)) return;

    var cardEl = btnEl.closest('.card');
    if (!cardEl) return;

    // HP adjustment button?
    if (typeof btnEl.dataset.delta !== 'undefined' && btnEl.dataset.delta !== '') {
      var cid = cardEl.dataset.id;
      var c = charById(cid);
      if (!c) return;
      var delta = parseInt(btnEl.dataset.delta, 10);
      if (isNaN(delta)) return;
      c.HP += delta; // plan supports HP below 0 and above maxHP
      saveCharacters();
      refreshHpCard(cardEl, c);
      announceHp(c);
      return;
    }

    var act = btnEl.dataset && btnEl.dataset.act;
    if (act === 'edit') { startEdit(cardEl.dataset.id); return; }
    if (act === 'delete') {
      var id2 = cardEl.dataset.id;
      var ch = charById(id2);
      if (ch && !confirm('Are you sure you want to delete "' + ch.name + '"?')) return;
      characters.splice(characters.indexOf(ch), 1); // indexOf reliable since ch is the exact object ref
      saveCharacters();
      renderGrid();
      toast('Removed "' + (ch ? ch.name : 'character') + '".');
      return;
    }
  });

  // ---------- Table of contents jump ----------
  tocSelect.addEventListener('change', function () {
    var id = tocSelect.value;
    if (!id) return;
    var cardEl = flashCard(id);
    if (cardEl && typeof cardEl.scrollIntoView === 'function') {
      // respect sticky header offset
      var st = window.pageYOffset || document.documentElement.scrollTop;
      var top = cardEl.getBoundingClientRect().top + st - 90; // ~ sticky bar height
      window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
    } else if (!cardEl) {
      toast('Character not found.');
    }
    // reset the dropdown so it can be reused for the next jump
    tocSelect.value = '';
  });

  toTopBtn.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ---------- Import / Export / Delete All ----------
  importBtn.addEventListener('click', function () {
    importFile.value = '';
    importFile.click();
  });
  importFile.addEventListener('change', function () {
    var f = importFile.files && importFile.files[0];
    if (!f) return;
    Promise.resolve(f.text()).then(function (text) { ingestImport(text); }).catch(function () { toast('Could not read the file.'); });
  });

  function ingestImport(text) {
    var data;
    try { data = JSON.parse(text); } catch (e) { toast('Invalid JSON in that file.'); return; }

    if (!Array.isArray(data)) data = [data]; // accept a single character object too

    if (data.length === 0) { toast('No characters found in the file.'); return; }

    var seen = {};
    characters.forEach(function (x) { seen[x.id] = true; });

    var addedNames = [];
    var skipped = 0;
    for (var i = 0; i < data.length; i++) {
      if (!data[i] || typeof data[i] !== 'object') { skipped++; continue; }
      var c2 = normalizeChar(data[i]); // id falls back to a fresh uid when missing/blank
      if (!c2.name) { skipped++; continue; } // skip entries with no usable name
      if (seen[c2.id]) c2.id = uid(); // guarantee unique ids vs. existing list and within this batch
      seen[c2.id] = true;
      characters.push(c2);
      addedNames.push(c2.name);
    }

    saveCharacters();
    renderGrid();

    if (addedNames.length === 0) {
      toast('Nothing to import: ' + skipped + ' ent' + (skipped === 1 ? 'ry had' : 'ries had') + ' no name.');
      return;
    }
    var total = addedNames.length + skipped, okCount = addedNames.length;
    toast('Imported ' + okCount + ' of ' + total + ' character(s). (duplicate ids were regenerated)');
  }

  exportBtn.addEventListener('click', function () {
    if (characters.length === 0) { toast('No characters to export yet.'); return; }
    var payload = sortedChars().map(makePlain);
    var blob = new Blob([JSON.stringify(payload, null, 4)], { type: 'application/json' });

    var url = URL.createObjectURL(blob);
    var aEl = document.createElement('a');
    aEl.href = url;
    var d = new Date();
    function pad2(n) { return String(n).length < 2 ? '0' + n : String(n); }
    aEl.download = 'npcs-' + d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + '.json';
    document.body.appendChild(aEl); // required for some browsers (Safari) and older WebKit paths
    aEl.click();
    setTimeout(function () { if (aEl.parentElement) aEl.remove(); }, 600); // drop transient anchor once download kicks off
    setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e2) {} }, 5000); // keep blob alive until any lazy reader is done

    toast('Exported ' + payload.length + ' character(s).');
  });

  deleteAllBtn.addEventListener('click', function () {
    if (characters.length === 0) return;
    var n = characters.length;
    var ok = window.confirm("Delete all " + n + " character" + (n === 1 ? '' : 's') + "? This cannot be undone.");
    if (!ok) return;
    characters = [];
    saveCharacters();
    renderGrid();
    toast('All characters deleted.');
  });

  // ---------- Theme / Dark mode ----------
  function persistSettings() { safeSet(SETTINGS_KEY, JSON.stringify({ theme: rootEl.dataset.theme, mode: rootEl.dataset.mode })); }

  themeSelect.addEventListener('change', function () {
    var v = themeSelect.value;
    if (THEMES.indexOf(v) === -1) v = 'space';
    rootEl.dataset.theme = v;
    persistSettings();
  });

  function syncDarkBtn() {
    var dark = rootEl.dataset.mode === 'dark';
    darkModeBtn.textContent = dark ? 'Light Mode' : 'Dark Mode';
    darkModeBtn.setAttribute('aria-pressed', String(dark));
    // ensure <html> has an explicit color-scheme hint via CSS variables (already handled by stylesheet)
  }

  darkModeBtn.addEventListener('click', function () {
    rootEl.dataset.mode = rootEl.dataset.mode === 'dark' ? 'light' : 'dark';
    syncDarkBtn();
    persistSettings();
  });

  // ---------- Form buttons ----------
  form.addEventListener('submit', handleSave);
  cancelBtn.addEventListener('click', function (ev) { ev && ev.preventDefault && ev.preventDefault(); resetForm(editingId !== null ? 'Editing cancelled.' : undefined); });

  // ---------- Init ----------
  var initTheme = rootEl.dataset.theme;
  if (THEMES.indexOf(initTheme) === -1 || !initTheme) {
    initTheme = 'space';
    rootEl.dataset.theme = initTheme;
  }
  themeSelect.value = initTheme;
  if (!rootEl.dataset.mode) rootEl.dataset.mode = 'light'; // safety (inline script usually sets it already)
  syncDarkBtn();

  loadCharacters();
  renderGrid();
})();
</script>
</body>
</html>
