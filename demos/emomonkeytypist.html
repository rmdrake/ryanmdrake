<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emo Monkey Typist</title>
    <style>
        :root {
            --bg-color: #323437;
            --main-color: #e6e6e6;
            --sub-color: #646669;
            --error-color: #ca4754;
            --correct-color: #d1d0c5;
            --accent-color: #e2b714;
            --font-family: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--main-color);
            font-family: var(--font-family);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 5vh;
            height: 100vh;
            overflow: hidden;
        }

        #site-title {
            font-size: 5rem;
            margin-bottom: 1rem;
            user-select: none;
        }

        #app-container {
            max-width: 1000px;
            width: 90%;
            position: relative;
        }

        #stats-bar {
            display: flex;
            gap: 2rem;
            font-size: 1.5rem;
            color: var(--accent-color);
            margin-bottom: 1rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #stats-bar.visible { opacity: 1; }

        .stat-item { display: flex; flex-direction: column; }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; color: var(--sub-color); letter-spacing: 2px; }

        /* Text Display Area */
        #text-display {
            font-size: 1.8rem;
            line-height: 1.6;
            word-break: break all;
            position: relative;
            color: var(--sub-color);
            user-select: none;
            white-space: pre-wrap;
            min-height: 1.6em; /* Prevents jumping when empty */
        }

        .char {
            position: relative;
            /* Characters start dim as requested */
        }

        .char.correct {
            color: var(--correct-color);
        }

        .char.incorrect {
            color: var(--error-color);
            background-color: rgba(202, 71, 84, 0.2);
            border-radius: 2px;
        }

        /* THE CURSOR: A separate element that follows the text */
        #cursor {
            position: absolute;
            width: 2px;
            height: 1.5em;
            background-color: var(--accent-color);
            display: none;
            transition: all 0.1s ease;
            pointer-events: none;
            z-index: 5;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .cursor-blink {
            animation: blink 1s infinite;
        }

        #typing-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        #controls {
            display: flex;
            justify-content: center;
            margin-top: 2rem;
        }

        button {
            background: transparent;
            border: 2px solid var(--sub-color);
            color: var(--sub-color);
            padding: 0.5rem 1.5rem;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--sub-color);
            color: var(--bg-color);
        }

        #result-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(50, 52, 55, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3rem; margin-bottom: 2rem; }
        .result-val { font-size: 3rem; color: var(--accent-color); display: block; }
        .result-lbl { font-size: 0.8rem; color: var(--sub-color); text-transform: uppercase; }
    header {
        width: 100%;
        padding: 1rem 2rem;
        text-align: left;
        font-size: 1.5rem;
        color: var(--sub-color);
    }

    footer {
        width: 100%;
        padding: 1rem;
        text-align: center;
        font-size: 0.9rem;
        color: var(--sub-color);
        margin-top: auto;
    }

    footer a {
        color: var(--accent-color);
        text-decoration: none;
    }

    footer a:hover {
        text-decoration: underline;
    }
</style>
    
</head>
<body>

    <div id="site-title">🥀🖤🐒⌨️</div>

            <div class="stat-item"><span class="stat-label">time</span><span id="time-val">0s</span></div>
        </div>

        <div id="text-display">
            <div id="cursor" class="cursor-blink"></div>
            <!-- Characters injected here -->
        </div>

        <input type="text" id="typing-input" autocomplete="off">

        <div id="controls">
            <button id="restart-btn">Restart (Tab)</button>
        </div>
    </div>

    <div id="result-screen">
        <h1 style="margin-bottom: 2rem; color: var(--sub-color);">Results</h1>
        <div class="result-grid">

            <div class="stat-item"><span class="result-val" id="res-acc">0%</span><span class="result-lbl">accuracy</span></div>
            <div class="stat-item"><span class="result-val" id="res-err">0</span><span class="result-lbl">errors</span></div>
        </div>
        <button onclick="game.init()">Play Again (tab)</button>
    </div>

        class TypingGame {
            constructor() {
                this.input = document.getElementById('typing-input');
                this.display = document.getElementById('text-display');
                this.cursor = document.getElementById('cursor');
                this.wpmEl = document.getElementById('wpm-val');
                this.accEl = document.getElementById('acc-val');
                this.timeEl = document.getElementById('time-val');
                this.statsBar = document.getElementById('stats-bar');
                this.resultScreen = document.getElementById('result-screen');
                
                this.targetText = "";
                this.characters = [];
                this.currentIndex = 0;
                this.startTime = null;
                this.timerInterval = null;
                this.errors = 0;
                this.isFinished = false;
                this.correctChars = 0;

                this.init();
                this.setupListeners();
            }

            init() {
                this.isFinished = false;
                this.currentIndex = 0;
                this.errors = 0;
                this.correctChars = 0;
                this.startTime = null;
                clearInterval(this.timerInterval);
                this.input.value = "";
                this.resultScreen.style.display = 'none';
                this.statsBar.classList.remove('visible');
                this.wpmEl.textContent = "0";
                this.accEl.textContent = "100%";
                this.timeEl.textContent = "0s";
                this.cursor.style.display = 'none';

                this.targetText = sentences[Math.floor(Math.random() * sentences.length)];
                this.renderText();
                this.input.focus();
            }

            renderText() {
                // FIX: Clear the entire display area first
                this.display.innerHTML = "";
                // Re-append the cursor so it's not lost during the clear
                this.display.appendChild(this.cursor);
                
                const chars = this.targetText.split('').map(char => {
                    const span = document.createElement('span');
                    span.textContent = char;
                    span.className = 'char';
                    this.display.appendChild(span);
                    return span;
                });
                this.characters = chars;
                this.updateCursorPosition();
            }

            setupListeners() {
                document.addEventListener('click', () => this.input.focus());
                this.input.addEventListener('input', (e) => this.handleInput(e));
                this.input.addEventListener('keydown', (e) => {
                    if (e.key === 'Tab') {
                        e.preventDefault();
                        this.init();
                    }
                });
            }

            handleInput(e) {
                if (this.isFinished) return;

                if (!this.startTime) {
                    this.startTime = new Date();
                    this.statsBar.classList.add('visible');
                    this.startTimer();
                }

                const userValue = this.input.value;
                const inputChar = userValue[userValue.length - 1];

                if (e.inputType === 'deleteContentBackward') {
                    if (this.currentIndex > 0) {
                        this.currentIndex--;
                        if (this.characters[this.currentIndex].classList.contains('correct')) {
                            this.correctChars--;
                        } else if (this.characters[this.currentIndex].classList.contains('incorrect')) {
                            this.errors--;
                        }
                        this.characters[this.currentIndex].className = 'char';
                        this.updateCursorPosition();
                        this.updateStats();
                    }
                    return;
                }

                const targetChar = this.targetText[this.currentIndex];

                if (inputChar === targetChar) {
                    this.characters[this.currentIndex].classList.add('correct');
                    this.characters[this.currentIndex].classList.remove('incorrect');
                    this.correctChars++;
                } else {
                    this.characters[this.currentIndex].classList.add('incorrect');
                    this.errors++;
                }

                this.currentIndex++;
                this.updateStats();
                this.updateCursorPosition();

                if (this.currentIndex === this.targetText.length) {
                    this.finish();
                }
            }

            updateCursorPosition() {
                const nextChar = this.characters[this.currentIndex];
                
                if (nextChar) {
                    this.cursor.style.display = 'block';
                    // Use offsetLeft/Top relative to the text-display container
                    this.cursor.style.left = `${nextChar.offsetLeft}px`;
                    this.cursor.style.top = `${nextChar.offsetTop}px`;
                    this.cursor.style.height = `${nextChar.offsetHeight}px`;
                } else {
                    this.cursor.style.display = 'none';
                }
            }

            startTimer() {
                this.timerInterval = setInterval(() => {
                    const diff = Math.floor((new Date() - this.startTime) / 1000);
                    this.timeEl.textContent = `${diff}s`;
                }, 1000);
            }

            updateStats() {
                const timeInMins = (new Date() - this.startTime) / 60000;
                if (timeInMins > 0) {
                    const wpm = Math.round((this.correctChars / 5) / timeInMins);
                    this.wpmEl.textContent = wpm;
                }
                if (this.currentIndex > 0) {
                    const accuracy = Math.round((this.correctChars / this.currentIndex) * 100);
                    this.accEl.textContent = `${accuracy}%`;
                } else {
                    this.accEl.textContent = `100%`;
                }
            }

            finish() {
                this.isFinished = true;
                clearInterval(this.timerInterval);
                
                setTimeout(() => {
                    document.getElementById('res-wpm').textContent = this.wpmEl.textContent;
                    document.getElementById('res-acc').textContent = this.accEl.textContent;
                    document.getElementById('res-err').textContent = this.errors;
                    this.resultScreen.style.display = 'flex';
                }, 500);
            }
        }

        const game = new TypingGame();
