<!DOCTYPE html>
<html lang="en" data-theme="dark" data-scheme="space">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Holder</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --sidebar-bg: #f5f5f5;
            --text-color: #333333;
            --border-color: #dddddd;
            --accent-color: #0078d4;
            --hover-color: #e0e0e0;
            --header-bg: #f0f0f0;
            --editor-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #1e1e1e;
            --sidebar-bg: #252526;
            --text-color: #d4d4d4;
            --border-color: #3c3c3c;
            --accent-color: #007acc;
            --hover-color: #37373d;
            --header-bg: #333333;
            --editor-bg: #1e1e1e;
        }

        /* Theme Schemes */
        [data-scheme="ocean"][data-theme="light"] {
            --sidebar-bg: #eaf2f8;
            --accent-color: #0284c7;
            --hover-color: #edf4fa;
            --header-bg: #edf4fa;
        }
        [data-scheme="ocean"][data-theme="dark"] {
            --bg-color: #1a2129;
            --sidebar-bg: #222c36;
            --accent-color: #38bdf8;
            --hover-color: #283440;
            --header-bg: #222c36;
            --editor-bg: #1a2129;
        }
        [data-scheme="desert"][data-theme="light"] {
            --sidebar-bg: #f7efe6;
            --accent-color: #c2410c;
            --hover-color: #f4eadd;
            --header-bg: #f4eadd;
        }
        [data-scheme="desert"][data-theme="dark"] {
            --bg-color: #271f18;
            --sidebar-bg: #302821;
            --accent-color: #fb923c;
            --hover-color: #362c23;
            --header-bg: #302821;
            --editor-bg: #271f18;
        }
        [data-scheme="forest"][data-theme="light"] {
            --sidebar-bg: #ecf3ec;
            --accent-color: #15803d;
            --hover-color: #eaf1ea;
            --header-bg: #eaf1ea;
        }
        [data-scheme="forest"][data-theme="dark"] {
            --bg-color: #1c221c;
            --sidebar-bg: #242c24;
            --accent-color: #4ade80;
            --hover-color: #2a322a;
            --header-bg: #242c24;
            --editor-bg: #1c221c;
        }

        * {
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: #ccc var(--sidebar-bg);
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--sidebar-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #999;
        }

        [data-theme="dark"] * {
            scrollbar-color: #555 var(--sidebar-bg);
        }

        [data-theme="dark"] ::-webkit-scrollbar-thumb {
            background: #555;
        }

        [data-theme="dark"] ::-webkit-scrollbar-thumb:hover {
            background: #777;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        /* Layout */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            height: 50px;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .brand {
            font-weight: bold;
            font-size: 1.2rem;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
        }

        button {
            padding: 4px 12px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            border-radius: 4px;
            font-size: 0.9rem;
        }

        button:hover {
            background-color: var(--hover-color);
        }

        button.primary {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        aside {
            min-width: 150px;
            max-width: 500px;
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .resizer {
            width: 4px;
            cursor: col-resize;
            background-color: var(--border-color);
            transition: background-color 0.2s;
        }

        .resizer:hover, .resizer.active {
            background-color: var(--accent-color);
        }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
        }

        .sidebar-item {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.9rem;
        }

        .sidebar-item:hover {
            background-color: var(--hover-color);
        }

        .sidebar-item.active {
            background-color: var(--hover-color);
            border-left: 4px solid var(--accent-color);
        }

        .search-container {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        #sidebar-search {
            width: 100%;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 0.9rem;
        }

        /* Workspace */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--editor-bg);
            overflow: hidden;
        }

        #editor-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .editor-header {
            padding: 10px;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }

        #note-title {
            flex: 1;
            padding: 5px;
            font-size: 1.2rem;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-color);
            font-weight: bold;
        }

        #note-title:focus {
            outline: none;
            border-color: var(--border-color);
        }

        .editor-body {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #note-content {
            flex: 1;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            resize: none;
            border: none;
            background: transparent;
            color: var(--text-color);
            outline: none;
        }

        .empty-state {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-style: italic;
        }

        .hidden {
            display: none !important;
        }

        #import-file {
            display: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="brand">Note Holder</div>
        <div class="actions">
            <button onclick="createNewNote()" style="color: var(--accent-color);">New</button>
            <button onclick="triggerOpen()" style="color: var(--accent-color);">Open</button>
            <button onclick="exportNotes()">Export</button>
            <button onclick="triggerImport()">Import</button>
            <select id="theme-scheme-select" onchange="changeThemeScheme(this.value)" style="padding: 4px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); font-size: 0.9rem; cursor: pointer;">
                <option value="space">Space</option>
                <option value="ocean">Ocean</option>
                <option value="desert">Desert</option>
                <option value="forest">Forest</option>
            </select>
            <input type="file" id="import-file" accept=".json" onchange="importNotes(event)">
            <input type="file" id="open-file" accept=".txt,.md,.log" style="display: none;" onchange="openNote(event)">
            <button onclick="toggleTheme()" id="theme-toggle">🌙</button>
        </div>
    </header>

    <div class="main-content">
        <aside>
            <div class="search-container">
                <input type="text" id="sidebar-search" placeholder="Search notes..." oninput="filterNotes()">
            </div>
            <div class="sidebar-list" id="sidebar-list">
                <!-- Notes will appear here -->
            </div>
        </aside>
        <div id="resizer" class="resizer"></div>
        <main>
            <div id="editor-view" class="hidden">
                <div class="editor-header">
                    <input type="text" id="note-title" placeholder="Note Title" spellcheck="true">
                    <button onclick="copyToClipboard(event)" style="color: var(--accent-color);">Copy</button>
                    <button onclick="saveNoteAsMarkdown()" style="color: var(--accent-color);">Save</button>
                    <button onclick="deleteCurrentNote()" style="color: #d93025;">Delete</button>
                </div>
                <div class="editor-body">
                    <textarea id="note-content" placeholder="Start writing..." spellcheck="true"></textarea>
                </div>
            </div>
            <div id="empty-view" class="empty-state">
                Select a note or create a new one
            </div>
        </main>
    </div>
</div>

<script>
    // State
    let notes = [];
    let selectedNoteId = null;
    let currentTheme = 'dark';

    // DOM Elements
    const sidebarList = document.getElementById('sidebar-list');
    const editorView = document.getElementById('editor-view');
    const emptyView = document.getElementById('empty-view');
    const titleInput = document.getElementById('note-title');
    const contentInput = document.getElementById('note-content');
    const themeToggleBtn = document.getElementById('theme-toggle');
    const resizer = document.getElementById('resizer');
    const sidebar = document.querySelector('aside');

    // --- Resizable Sidebar Logic ---

    let isResizing = false;

    resizer.addEventListener('mousedown', (e) => {
        isResizing = true;
        document.body.classList.add('resizing');
        // Prevent text selection while dragging
        document.body.style.cursor = 'col-resize';
    });

    document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;

        // Calculate new width based on mouse position
        const newWidth = e.clientX;
        
        // Apply constraints
        if (newWidth > 150 && newWidth < 500) {
            sidebar.style.width = `${newWidth}px`;
        }
    });

    document.addEventListener('mouseup', () => {
        isResizing = false;
        document.body.classList.remove('resizing');
        document.body.style.cursor = '';
    });

    // Initialize
    function init() {
        const savedTheme = localStorage.getItem('theme') || 'dark';
        const savedScheme = localStorage.getItem('scheme') || 'space';

        currentTheme = savedTheme;
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.documentElement.setAttribute('data-scheme', savedScheme);
        
        const themeToggleBtn = document.getElementById('theme-toggle');
        if (themeToggleBtn) {
            themeToggleBtn.textContent = currentTheme === 'light' ? '🌙' : '☀️';
        }

        const schemeSelect = document.getElementById('theme-scheme-select');
        if (schemeSelect) {
            schemeSelect.value = savedScheme;
        }
    }

    // --- Note Operations ---

    function createNewNote() {
        const newNote = {
            id: Date.now().toString(),
            title: 'Untitled Note',
            content: ''
        };
        notes.push(newNote);
        selectNote(newNote.id);
        renderSidebar();
    }

    function triggerOpen() {
        document.getElementById('open-file').click();
    }

    function openNote(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const content = e.target.result;
            const title = file.name.replace(/\.[^/.]+$/, "");
            
            const newNote = {
                id: Date.now().toString(),
                title: title,
                content: content
            };
            
            notes.push(newNote);
            selectNote(newNote.id);
            renderSidebar();
        };
        reader.readAsText(file);
        event.target.value = '';
    }

    function copyToClipboard(event) {
        const content = contentInput.value;
        if (!content) {
            return;
        }
        navigator.clipboard.writeText(content).then(() => {
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 2000);
        }).catch(err => {
            console.error('Failed to copy: ', err);
        });
    }

    function saveNoteAsMarkdown() {
        const title = titleInput.value || 'Untitled Note';
        const content = contentInput.value;
        
        const blob = new Blob([content], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        
        // Sanitize filename: replace invalid characters with underscore
        const filename = title.replace(/[\\/:"*?<>|]/g, '_') + '.txt';
        
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    function selectNote(id) {
        selectedNoteId = id;
        const note = notes.find(n => n.id === id);
        
        if (note) {
            editorView.classList.remove('hidden');
            emptyView.classList.add('hidden');
            titleInput.value = note.title;
            contentInput.value = note.content;
        } else {
            editorView.classList.add('hidden');
            emptyView.classList.remove('hidden');
        }
        renderSidebar();
    }

    function deleteCurrentNote() {
        if (!selectedNoteId) return;
        if (confirm('Are you sure you want to delete this note?')) {
            notes = notes.filter(n => n.id !== selectedNoteId);
            selectedNoteId = null;
            editorView.classList.add('hidden');
            emptyView.classList.remove('hidden');
            renderSidebar();
        }
    }

    // --- Rendering ---

    let searchQuery = '';

    function filterNotes() {
        searchQuery = document.getElementById('sidebar-search').value.toLowerCase();
        renderSidebar();
    }

    function renderSidebar() {
        sidebarList.innerHTML = '';
        
        // Sort notes alphabetically by title
        const sortedNotes = [...notes].sort((a, b) => 
            a.title.localeCompare(b.title)
        );

        sortedNotes.forEach(note => {
            if (searchQuery && !note.title.toLowerCase().includes(searchQuery)) {
                return;
            }
            const item = document.createElement('div');
            item.className = `sidebar-item ${note.id === selectedNoteId ? 'active' : ''}`;
            item.textContent = note.title || 'Untitled Note';
            item.onclick = () => selectNote(note.id);
            sidebarList.appendChild(item);
        });
    }

    // --- Input Handlers ---

    titleInput.addEventListener('blur', () => {
        const note = notes.find(n => n.id === selectedNoteId);
        if (note) {
            note.title = titleInput.value || 'Untitled Note';
            renderSidebar();
        }
    });

    contentInput.addEventListener('input', () => {
        const note = notes.find(n => n.id === selectedNoteId);
        if (note) {
            note.content = contentInput.value;
        }
    });

    // --- Data Portability ---

    function exportNotes() {
        if (notes.length === 0) {
            alert('No notes to export.');
            return;
        }
        const dataStr = JSON.stringify(notes, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `noteholder_export.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    function triggerImport() {
        document.getElementById('import-file').click();
    }

    function importNotes(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedNotes = JSON.parse(e.target.result);
                
                if (!Array.isArray(importedNotes)) {
                    throw new Error('Invalid format: Expected an array of notes.');
                }

                let addedCount = 0;
                importedNotes.forEach(impNote => {
                    // Check for collisions based on id
                    const duplicate = notes.some(n => n.id === impNote.id);
                    if (!duplicate) {
                        notes.push(impNote);
                        addedCount++;
                    }
                });

                alert(`Import complete. Added ${addedCount} notes.`);
                renderSidebar();
            } catch (err) {
                alert('Error importing file: ' + err.message);
            }
            // Reset file input so same file can be selected again if needed
            event.target.value = '';
        };
        reader.readAsText(file);
    }

    // --- Theme Management ---

    function toggleTheme() {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        themeToggleBtn.textContent = currentTheme === 'light' ? '🌙' : '☀️';
        localStorage.setItem('theme', currentTheme);
    }

    function changeThemeScheme(scheme) {
        document.documentElement.setAttribute('data-scheme', scheme);
        localStorage.setItem('scheme', scheme);
    }

    // Initialization
    init();

</script>
</body>
</html>
