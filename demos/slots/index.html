<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Machines</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }
        .card-gradient {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .card-gradient:hover {
            border-color: rgba(59, 130, 245, 0.5);
            transform: translateY(-4px);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen font-sans">

    <div class="max-w-6xl mx-auto px-4 py-12">
        <!-- Header -->
        <header class="text-center mb-16">
            <h1 class="text-5xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500 mb-4">
                Slot Machines
            </h1>
            <p class="text-slate-400 text-lg">A collection of fun and engaging slot games.</p>
            
            <!-- Search / Filter -->
            <div class="mt-8 max-w-md mx-auto relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i data-lucide="search" class="w-5 h-5 text-slate-500"></i>
                </div>
                <input type="text" id="search" placeholder="Search slot games..." 
                    class="block w-full pl-10 pr-3 py-2 border border-slate-700 rounded-full leading-5 bg-slate-800 text-slate-200 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent sm:text-sm transition-all">
            </div>
        </header>

        <!-- Grid -->
        <div id="project-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards will be injected here by JavaScript -->
        </div>

        <!-- Footer -->
        <footer class="mt-24 text-center text-slate-500 text-sm">
            <p>&copy; <span id="year"></span> Ryan M Drake. All rights reserved.</p>
        </footer>

    </div>

    <script>
        // --- DATA CONFIGURATION ---
        const projects = [
            { title: 'Muse Slot', description: 'A standard, clean version of the slot game featuring basic emoji symbols and simple tone-based audio. It provides a straightforward and distraction-free gaming experience.', icon: 'gamepad-2', color: 'orange', link: 'slots_muse.html', github: 'https://github.com/rmdrake/slots' },
            { title: 'Flashy Slot', description: 'A highly polished version with extensive CSS animations, including twinkling stars and result flashes. It focuses on providing a dynamic and visually engaging user experience.', icon: 'gamepad-2', color: 'blue', link: 'slots_flashy.html', github: 'https://github.com/rmdrake/slots' },
            { title: 'Sexy Slot', description: 'An adult-themed variant that uses provocative emojis and a unique vertical reel-strip animation style. It offers a distinct visual and thematic departure from the other games.', icon: 'gamepad-2', color: 'purple', link: 'slots_sexy.html', github: 'https://github.com/rmdrake/slots' },
            { title: 'Noisy Slot', description: 'Features sophisticated melodic audio sequences for wins, losses, and jackpots, paired with a glassmorphic UI. The design focuses on high-quality audio-visual immersion.', icon: 'gamepad-2', color: 'red', link: 'slots_noisy.html', github: 'https://github.com/rmdrake/slots' },
            { title: 'Simple Slot', description: 'A minimalist and no-frills version of the game with very basic styling. It is designed for maximum simplicity and low computational overhead.', icon: 'gamepad-2', color: 'yellow', link: 'slots_simple.html', github: 'https://github.com/rmdrake/slots' },
            { title: 'Royal Slot', description: 'A "Space Fantasy" themed slot machine with a dark purple aesthetic and glowing animations. It provides a themed, immersive atmosphere with specific visual cues for winning.', icon: 'gamepad-2', color: 'blue', link: 'slots_royal.html', github: 'https://github.com/rmdrake/slots' },
            { title: 'Enhanced Slot', description: 'An intensely visual version featuring twinkling star backgrounds and highly reactive animations for every game outcome. It is the most feature-rich in terms of visual feedback and special effects.', icon: 'gamepad-2', color: 'emerald', link: 'slots_enhanced.html', github: 'https://github.com/rmdrake/slots' },
            { title: 'Neat Slot', description: 'A clean and professional version of the game with a well-structured, "neat" layout and subtle animations. It prioritizes clarity and a polished, modern aesthetic.', icon: 'gamepad-2', color: 'purple', link: 'slots_neat.html', github: 'https://github.com/rmdrake/slots' }
        ];

        const colorMap = {
            orange: { icon: 'text-orange-400', bg: 'bg-orange-500/10', hoverBg: 'group-hover:bg-orange-500/20', hoverText: 'group-hover:text-orange-400', githubHover: 'hover:text-orange-400' },
            blue: { icon: 'text-blue-400', bg: 'bg-blue-500/10', hoverBg: 'group-hover:bg-blue-500/20', hoverText: 'group-hover:text-blue-400', githubHover: 'hover:text-blue-400' },
            emerald: { icon: 'text-emerald-400', bg: 'bg-emerald-500/10', hoverBg: 'group-hover:bg-emerald-500/20', hoverText: 'group-hover:text-emerald-400', githubHover: 'hover:text-emerald-400' },
            yellow: { icon: 'text-yellow-400', bg: 'bg-yellow-500/10', hoverBg: 'group-hover:bg-yellow-500/20', hoverText: 'group-hover:text-yellow-400', githubHover: 'hover:text-yellow-400' },
            purple: { icon: 'text-purple-400', bg: 'bg-purple-500/10', hoverBg: 'group-hover:bg-purple-500/20', hoverText: 'group-hover:text-purple-400', githubHover: 'hover:text-purple-400' },
            red: { icon: 'text-red-400', bg: 'bg-red-500/10', hoverBg: 'group-hover:bg-red-500/20', hoverText: 'group-hover:text-red-400', githubHover: 'hover:text-red-400' }
        };

        // --- CORE LOGIC ---

        function renderProjects(filter = '') {
            const grid = document.getElementById('project-grid');
            grid.innerHTML = '';
            
            const searchTerm = filter.toLowerCase();
            
            const filteredProjects = projects
                .filter(p => 
                    p.title.toLowerCase().includes(searchTerm) || 
                    p.description.toLowerCase().includes(searchTerm)
                )
                .sort((a, b) => a.title.localeCompare(b.title));

            filteredProjects.forEach(p => {
                const colorConfig = colorMap[p.color];
                const card = document.createElement('div');
                card.className = 'card-gradient p-6 rounded-2xl group relative overflow-hidden transition-all duration-300 flex flex-col';
                
                card.innerHTML = `
                    <div class="flex items-start justify-between mb-4">
                        <div class="p-3 ${colorConfig.bg} rounded-lg ${colorConfig.hoverBg} transition-colors">
                            <i data-lucide="${p.icon}" class="w-6 h-6 ${colorConfig.icon}"></i>
                        </div>
                        <i data-lucide="external-link" class="w-4 h-4 text-slate-600 ${colorConfig.hoverText} transition-colors"></i>
                    </div>

                    <div class="flex-grow">
                        <h2 class="text-xl font-bold text-slate-100 mb-2">
                            <a href="${p.link}" class="after:absolute after:inset-0"> ${p.title} </a>
                        </h2>
                        <p class="text-slate-400 text-sm mb-4">${p.description}</p>
                    </div>

                    <div class="relative z-10 pt-4 border-t border-slate-700/50 flex justify-between items-center">
                        <a href="${p.github}" target="_blank" rel="noopener noreferrer" class="text-xs text-slate-500 ${colorConfig.githubHover} flex items-center gap-1 transition-colors">
                            <i data-lucide="github" class="w-3 h-3"></i> GitHub
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });

            lucide.createIcons();
        }

        // --- INITIALIZATION ---

        document.getElementById('year').textContent = new Date().getFullYear();
        renderProjects();

        document.getElementById('search').addEventListener('input', (e) => {
            renderProjects(e.target.value);
        });
    </script>
</body>
</html>
